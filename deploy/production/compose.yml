# Public production site for cx83labs.com.
# Separate from staging. The image is loaded on the server. Secrets stay in /opt/cx83-webapp-prod/.env.
# Postgres stays on the private network. Only the web container joins Coolify's proxy network.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cx83-webapp-prod-postgres
    environment:
      POSTGRES_USER: cx83
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cx83_webapp_production
    volumes:
      - /opt/cx83-webapp-prod/postgres:/var/lib/postgresql/data
    mem_limit: 192m
    shm_size: 64mb
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cx83 -d cx83_webapp_production']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  web:
    image: cx83-webapp:production
    container_name: cx83-webapp-prod
    env_file:
      - /opt/cx83-webapp-prod/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/cx83-webapp-prod/media:/app/public/media
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - internal
      - coolify

networks:
  internal:
  coolify:
    external: true
    name: coolify
