<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CX83 responsive banner</title>
  <link rel="stylesheet" href="banner.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #080e22; color: #e6ebf5; font-family: Arial, sans-serif; }
    .review-note { max-width: 720px; padding: 32px 24px; margin: auto; font-size: 16px; line-height: 1.6; }
    .review-note h1 { font-size: 25px; line-height: 1.3; margin: 0 0 8px; }
    .review-note p { color: #b6c5dd; margin: 0; }
  </style>
</head>
<body>
  <div class="cx83-responsive-banner" role="img" aria-label="CX83 Labs illuminated silver logo, electric blue and violet light, and reflections extending across the banner">
    <img class="cx83-responsive-banner__atmosphere" src="cx83-atmosphere-wide.png" alt="" aria-hidden="true">
    <img class="cx83-responsive-banner__original" src="cx83-original-banner.avif" alt="" aria-hidden="true" width="960" height="319">
  </div>
  <section class="review-note">
    <h1>The original identity, with room to expand.</h1>
    <p>The original center artwork stays proportional. The surrounding blue and violet atmosphere fills the available width. Resize this preview to see the banner adapt.</p>
  </section>
</body>
</html>
