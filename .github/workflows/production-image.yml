name: Production image

# Builds the public production image for https://cx83labs.com.
# This workflow does not deploy and does not change staging.
# The application commit is the verified staging revision, not this workflow commit.
# Load the artifact on the server with the existing root SSH key.

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLICATION_SHA: fe89b67cc0f06ef71452fab166d756bd5ab6fa12

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the application commit
        uses: actions/checkout@v4
        with:
          ref: fe89b67cc0f06ef71452fab166d756bd5ab6fa12
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bundle the deployed commit
        run: |
          git bundle create .cx83-staging-source.bundle HEAD
          git bundle verify .cx83-staging-source.bundle
          test "$(git rev-parse HEAD)" = "fe89b67cc0f06ef71452fab166d756bd5ab6fa12"

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cx83-webapp:production
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://cx83labs.com
            CX83_DEPLOYED_SHA=fe89b67cc0f06ef71452fab166d756bd5ab6fa12

      - name: Save the image
        run: docker save cx83-webapp:production | gzip -1 > cx83-webapp-production.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: cx83-webapp-production
          path: cx83-webapp-production.tar.gz
          retention-days: 7
